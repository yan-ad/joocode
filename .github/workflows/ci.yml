name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run native CI gate
        run: cargo xtask check

      - name: Check Homebrew formula generator
        run: |
          mkdir -p /tmp/joocode-formula
          printf '%064d  joocode-aarch64-apple-darwin.tar.gz\n' 1 > /tmp/joocode-formula/SHA256SUMS
          printf '%064d  joocode-x86_64-apple-darwin.tar.gz\n' 2 >> /tmp/joocode-formula/SHA256SUMS
          printf '%064d  joocode-aarch64-unknown-linux-gnu.tar.gz\n' 3 >> /tmp/joocode-formula/SHA256SUMS
          printf '%064d  joocode-x86_64-unknown-linux-gnu.tar.gz\n' 4 >> /tmp/joocode-formula/SHA256SUMS
           cargo xtask homebrew-formula v0.1.0 /tmp/joocode-formula/SHA256SUMS \
             --output /tmp/joocode-formula/joocode.rb
           cd /tmp/joocode-formula
           ruby -c joocode.rb
           grep -F '=> "jcx"' joocode.rb
           grep -F '=> "joocode"' joocode.rb

      - name: Check release notes generator
        run: |
          latest_tag="$(git tag --sort=-version:refname | head -n1)"
          test -n "$latest_tag"
          cargo xtask release-notes "$latest_tag" /tmp/RELEASE_NOTES.md
          grep -F "# Joocode $latest_tag" /tmp/RELEASE_NOTES.md
          grep -F "## What's changed" /tmp/RELEASE_NOTES.md
          grep -F "## Full changelog" /tmp/RELEASE_NOTES.md
