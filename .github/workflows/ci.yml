name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check Homebrew formula generator
        run: |
          mkdir -p /tmp/joc-formula
          printf '%064d  joc-aarch64-apple-darwin.tar.gz\n' 1 > /tmp/joc-formula/SHA256SUMS
          printf '%064d  joc-x86_64-apple-darwin.tar.gz\n' 2 >> /tmp/joc-formula/SHA256SUMS
          printf '%064d  joc-aarch64-unknown-linux-gnu.tar.gz\n' 3 >> /tmp/joc-formula/SHA256SUMS
          printf '%064d  joc-x86_64-unknown-linux-gnu.tar.gz\n' 4 >> /tmp/joc-formula/SHA256SUMS
          cd /tmp/joc-formula
          python3 "$GITHUB_WORKSPACE/scripts/generate-homebrew-formula.py" v0.1.0 SHA256SUMS >/dev/null
          ruby -c joc.rb
