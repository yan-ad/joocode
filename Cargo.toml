[package]
name = "joocode"
version = "0.1.15"
edition = "2024"
default-run = "jcx"
description = "Minimal native bridge that exposes models from OpenCode, OCX, Hermes, and GitHub Copilot to desktop AI clients"
license = "MIT"
repository = "https://github.com/yan-ad/joocode"
homepage = "https://github.com/yan-ad/joocode"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
http = "1"
json5 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml_edit = "0.23"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
